<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Form</title>
  <link rel="stylesheet" href="styles1.css">
</head>
<body>
  <div class="wrapper">
    <form id="signup-form">
      <h2>Signup</h2>
      <div class="input-field">
        <input type="email" id="signup-email" required>
        <label for="signup-email">Enter your email</label>
      </div>
      <div class="input-field">
        <input type="password" id="signup-password" required>
        <label for="signup-password">Enter your password</label>
      </div>
      <div class="input-field">
        <input type="password" id="signup-confirm-password" required>
        <label for="signup-confirm-password">Confirm your password</label>
      </div>
      <div class="input-field">
        <label for="role">Role:</label>
        <select id="role" required>
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
        </select>
      </div>
      <div id="signup-message" role="alert" aria-live="polite" style="color: #ff4d4d; margin-bottom: 10px; font-size: 14px; text-align: center;"></div>
      <button type="submit" id="signup-btn">Sign Up</button>
      <div class="register">
        <p>Already have an account? <a href="signin.html">Sign In</a></p>
      </div>
    </form>
    <button id="google-signup" type="button" onclick="window.location.href='http://localhost:5500/auth/google'">Sign Up with Google</button>
  </div>

  <script>
    document.getElementById('signup-form').addEventListener('submit', function(event) {
      event.preventDefault();
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const confirmPassword = document.getElementById('signup-confirm-password').value;
      const role = document.getElementById('role').value;
      const signupMessage = document.getElementById('signup-message');
      const submitBtn = document.getElementById('signup-btn');

      signupMessage.textContent = '';
      signupMessage.style.color = '#ff4d4d';

      if (password === confirmPassword) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing up...';

        fetch('http://localhost:5500/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role }),
        })
        .then(response => response.json())
        .then(data => {
          if (data.message === 'User registered successfully') {
            signupMessage.style.color = '#4caf50';
            signupMessage.textContent = 'Successfully signed up!';
            setTimeout(() => {
              window.location.href = 'signin.html';
            }, 1000);
          } else {
            signupMessage.textContent = data.message;
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign Up';
          }
        })
        .catch(error => {
          console.error('Error:', error);
          signupMessage.textContent = 'An error occurred. Please try again.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign Up';
        });
      } else {
        signupMessage.textContent = 'Passwords do not match.';
      }
    });
  </script>
</body>
</html>
