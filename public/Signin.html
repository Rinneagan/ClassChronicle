<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log into account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <form id="signin-form">
      <h2>Login</h2>
      <div class="input-field">
        <input type="email" id="signin-email" required>
        <label for="signin-email">Enter your email</label>
      </div>
      <div class="input-field">
        <input type="password" id="signin-password" required>
        <label for="signin-password">Enter your password</label>
      </div>
      <div class="input-field">
        <label for="role">Role:</label>
        <select id="role" required>
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
        </select>
      </div>
      <div class="forget">
        <label for="remember">
          <input type="checkbox" id="remember">
          <p>Remember me</p>
        </label>
        <a href="#">Forgot password?</a>
      </div>
      <div id="signin-message" role="alert" aria-live="polite" style="color: #ff4d4d; margin-bottom: 10px; font-size: 14px; text-align: center;"></div>
      <button type="submit" id="signin-btn">Log In</button>
      <div class="register">
        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('signin-form').addEventListener('submit', function(event) {
      event.preventDefault();
      const email = document.getElementById('signin-email').value;
      const password = document.getElementById('signin-password').value;
      const role = document.getElementById('role').value;
      const signinMessage = document.getElementById('signin-message');
      const submitBtn = document.getElementById('signin-btn');

      signinMessage.textContent = '';
      signinMessage.style.color = '#ff4d4d';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      fetch('http://localhost:5500/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, role }),
      })
      .then(response => response.json())
      .then(data => {
        if (data.token) {
          signinMessage.style.color = '#4caf50';
          signinMessage.textContent = 'Successfully signed in!';
          localStorage.setItem('token', data.token);
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 500);
        } else {
          signinMessage.textContent = data.message;
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log In';
        }
      })
      .catch(error => {
        console.error('Error:', error);
        signinMessage.textContent = 'An error occurred. Please try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In';
      });
    });
  </script>
</body>
</html>
